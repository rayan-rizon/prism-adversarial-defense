# Smoke-only variant of top_tier_train_split_cifar10.yaml.
# This verifies the strict train-split code path without producing publishable
# numbers. Do not use this config for paper claims.

model:
  name: cifar_resnet18
  backbone_checkpoint: models/cifar_resnet18.pt
  num_classes: 10
  layer_names:
    - layer2
    - layer3
    - layer4
  layer_weights:
    layer2: 0.30
    layer3: 0.30
    layer4: 0.40

tda:
  n_subsample: 32
  max_dim: 1
  n_reference: 8
  dim_weights: [0.70, 0.30]

conformal:
  alphas:
    L1: 0.10
    L2: 0.03
    L3: 0.005
  calibration_size: 100
  validation_size: 20
  cal_alpha_factor: 0.7
  tier_cal_alpha_factors:
    L1: 0.75
    L2: 0.55
    L3: 0.52

splits:
  profile_idx: [0, 12]
  cal_idx:     [12, 112]
  val_idx:     [112, 132]
  eval_idx:    [8000, 8020]

campaign:
  window_size: 10
  cp_threshold: 0.3
  hazard_rate: 0.033
  mu0: 7.0
  beta0: 15.0
  alert_run_length: 3
  alert_run_prob: 0.60
  warmup_steps: 5
  l0_factor: 0.8

moe:
  n_experts: 4
  hidden_dim: 256

memory:
  match_threshold: 0.5

data:
  dataset: cifar10
  image_size: 32
  mean: [0.4914, 0.4822, 0.4465]
  std:  [0.2470, 0.2435, 0.2616]
  data_root: ./data

profiling:
  n_clean_images: 132

evaluation:
  n_test_images: 4
  attacks:
    - FGSM
    - PGD
    - Square

paths:
  reference_profiles: models/top_tier_train_split_smoke/reference_profiles.pkl
  calibrator: models/top_tier_train_split_smoke/calibrator.pkl
  ensemble_scorer: models/top_tier_train_split_smoke/ensemble_scorer.pkl
  experts: models/top_tier_train_split_smoke/experts.pkl
  clean_scores: experiments/top_tier_train_split_smoke/calibration/clean_scores.npy
