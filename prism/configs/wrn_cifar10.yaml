# PRISM config — WRN-28-10 backbone on CIFAR-10 (Stretch A)
#
# Used via:  PRISM_CONFIG=configs/wrn_cifar10.yaml bash run_stretch_a_thundercompute.sh
#
# Key differences from the ResNet-18 default:
#   model.arch             : wrn28_10  (triggers backbone.py WRN dispatch)
#   model.backbone_checkpoint: models/cifar_wrn28_10.pt
#   model.layer_names      : [layer1, layer2, layer3]  (WRN has no layer4)
#   model.layer_weights    : same 0.30/0.30/0.40 depth-emphasis pattern
#   paths.*                : all artifacts written under models/wrn/ and
#                            experiments/wrn/ to avoid clobbering ResNet-18 results

model:
  arch: wrn28_10
  backbone_checkpoint: models/cifar_wrn28_10.pt
  layer_names: [layer1, layer2, layer3]
  layer_weights:
    layer1: 0.30
    layer2: 0.30
    layer3: 0.40
  num_classes: 10

tda:
  n_subsample: 150
  max_dim: 1
  dim_weights: [0.70, 0.30]

conformal:
  alphas:
    L1: 0.10
    L2: 0.03
    L3: 0.005
  cal_alpha_factor: 0.7
  tier_cal_alpha_factors:
    L1: 0.75
    L2: 0.55
    L3: 0.52

data:
  dataset: cifar10
  mean: [0.4914, 0.4822, 0.4465]
  std:  [0.2470, 0.2435, 0.2616]
  image_size: 32

splits:
  profile_idx: [0,    5000]
  cal_idx:     [5000, 7000]
  val_idx:     [7000, 8000]
  eval_idx:    [8000, 10000]

# Separate artifact paths — WRN artifacts never overwrite ResNet-18 artifacts.
paths:
  reference_profiles: models/wrn/reference_profiles.pkl
  calibrator:         models/wrn/calibrator.pkl
  ensemble_scorer:    models/wrn/ensemble_scorer.pkl
  experts:            models/wrn/experts.pkl
  clean_scores:       experiments/wrn/calibration/clean_scores.npy
